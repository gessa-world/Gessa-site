<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GESSA – مجتمعك .. عالمك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:#011335;display:grid;place-items:center;overflow-x:hidden;font-family:"Cairo","Segoe UI",Tahoma,sans-serif}
.stage{position:relative;width:min(100vw,177.69vh);aspect-ratio:1672/941;container-type:inline-size}
.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.stage>*{position:absolute}
.stage>img{position:absolute}
.hit{background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:1.2cqw}
.hit.round{border-radius:50%}
.hit:focus-visible,.fld:focus-visible,.reg input:focus-visible,.reg button:focus-visible{outline:3px solid #19d3f5;outline-offset:1px}
.fld{background:transparent;border:0;color:#eaf2ff;font:600 max(1.25cqw,12px)/1 "Cairo",sans-serif;padding:0 2cqw 0 .6cqw;text-align:right;border-radius:1cqw}
.fld:not(:placeholder-shown),.fld:focus{background:#192e4e}
.chk{display:none;background:#192e4e;border:2px solid #3d8fe0;border-radius:.5cqw;pointer-events:none}
.chk.off{display:block}
.reg{background:#021235;border-radius:0 0 2.4cqw 2.4cqw;display:flex;flex-direction:column;align-items:stretch;gap:1cqw;padding:1.4cqw 3cqw 1.2cqw;z-index:3}
.reg[hidden]{display:none}
.reg h2{margin:0;text-align:center;font-size:max(2.3cqw,16px);font-weight:800;color:#fff}
.reg .hint{margin:0 0 .4cqw;text-align:center;color:#19d3f5;font-weight:600;font-size:max(1.25cqw,11px)}
.reg input{height:4.1cqw;border-radius:1.6cqw;border:2px solid #3d8fe0;background:#192e4e;color:#eaf2ff;font:600 max(1.25cqw,12px) "Cairo",sans-serif;padding:0 1.6cqw}
.reg input::placeholder{color:#8fa3c8}
.rgo{height:4cqw;border:0;border-radius:1.6cqw;background:linear-gradient(#ff3a3a,#c2101e);color:#fff;font:800 max(1.7cqw,13px) "Cairo",sans-serif;cursor:pointer;box-shadow:0 0 1.2cqw #e3202e77}
.back{background:none;border:0;color:#19d3f5;font:600 max(1.1cqw,11px) "Cairo",sans-serif;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:92vw;background:#0b2a6a;border:2px solid #1f8bff;color:#fff;padding:10px 18px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 8px 28px #000a;z-index:9}
.toast[hidden]{display:none}
</style></head>

<h2>إنشاء حساب جديد</h2><p class="hint">أنشئ حسابك وابدأ رحلتك</p>
<input id="rn" type="text" dir="rtl" placeholder="اسم المستخدم" autocomplete="username" aria-label="اسم المستخدم">
<input id="re" type="email" dir="rtl" placeholder="البريد الإلكتروني" autocomplete="email" aria-label="البريد الإلكتروني">
<input id="rp" type="password" dir="rtl" placeholder="كلمة المرور (8 أحرف على الأقل)" autocomplete="new-password" aria-label="كلمة المرور">

<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let toastTimer;
  function say(m){ const t=$('toast'); if(t){t.textContent=m;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,6500);} }
  function client(){ if(!window.GESSA || !GESSA.ok()){say('أدخل بيانات Supabase العامة في ملف config.js أولاً.');return null;} return GESSA.client(); }
  function showReg(on){$('regPanel').hidden=!on;if(on)$('rn').focus();}
  $('tabReg').onclick=()=>showReg(true);
  $('tabLogin').onclick=()=>showReg(false);
  $('back').onclick=()=>showReg(false);
  $('eye').onclick=()=>{const p=$('pw');p.type=p.type==='password'?'text':'password';};
  function remember(){return $('rem').getAttribute('aria-checked')==='true';}
  $('rem').onclick=function(){const on=!remember();this.setAttribute('aria-checked',String(on));$('chkBox').classList.toggle('off',!on);};
  function explain(err){
    const m=(err&&err.message)||'';
    if(/Invalid login/i.test(m))say('البريد الإلكتروني أو كلمة المرور غير صحيحة.');
    else if(/already registered/i.test(m))say('هذا البريد مسجل بالفعل. جرّب تسجيل الدخول.');
    else if(/rate limit/i.test(m))say('محاولات كثيرة. انتظر قليلًا ثم حاول مجددًا.');
    else if(/Email not confirmed/i.test(m))say('أكد بريدك الإلكتروني من الرسالة التي وصلتك أولًا.');
    else if(/username/i.test(m)&&/duplicate|unique/i.test(m))say('اسم المستخدم مستخدم بالفعل. اختر اسمًا آخر.');
    else say('تعذر إكمال العملية: '+m);
  }
  async function login(){
    const email=$('id').value.trim(), password=$('pw').value;
    if(!/^\S+@\S+\.\S+$/.test(email))return say('اكتب بريدًا إلكترونيًا صحيحًا.');
    if(password.length<8)return say('كلمة المرور يجب ألا تقل عن 8 أحرف.');
    const c=client();if(!c)return;
    const {error}=await c.auth.signInWithPassword({email,password});
    if(error)return explain(error);
    location.href='home.html';
  }
  $('go').onclick=login;
  ['id','pw'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')login();}));
  $('forgot').onclick=async function(){
    const email=$('id').value.trim();
    if(!/^\S+@\S+\.\S+$/.test(email))return say('اكتب بريدك الإلكتروني في خانة البريد أولًا.');
    const c=client();if(!c)return;
    const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});
    if(error)return explain(error);
    say('إذا كان البريد مسجلًا، سيصلك رابط إعادة تعيين كلمة المرور.');
  };
  $('regPanel').onsubmit=async function(e){
    e.preventDefault();
    const username=$('rn').value.trim(),email=$('re').value.trim(),password=$('rp').value;
    if(!/^[A-Za-z0-9_]{3,30}$/.test(username))return say('اسم المستخدم من 3 إلى 30 حرفًا إنجليزيًا أو رقمًا أو _');
    if(!/^\S+@\S+\.\S+$/.test(email))return say('اكتب بريدًا إلكترونيًا صحيحًا.');
    if(password.length<8)return say('كلمة المرور يجب ألا تقل عن 8 أحرف.');
    const c=client();if(!c)return;
    const {data,error}=await c.auth.signUp({
      email,password,
      options:{data:{username:username,display_name:username},emailRedirectTo:location.origin+location.pathname}
    });
    if(error)return explain(error);
    if(data.session){say('تم إنشاء حسابك بنجاح.');location.href='home.html';}
    else say('تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد. تم إرسال اسم المستخدم إلى ملفك الشخصي تلقائيًا.');
  };
  const providers={Google:'google',Facebook:'facebook',X:'twitter'};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{
    const c=client();if(!c)return;
    const {error}=await c.auth.signInWithOAuth({provider:providers[b.getAttribute('data-p')],options:{redirectTo:location.origin+'/home.html'}});
    if(error)explain(error);
  });
  if(window.GESSA&&GESSA.ok()){
    GESSA.client().auth.getSession().then(({data})=>{if(data.session)location.replace('home.html');});
  }
})();
</script>
</body></html>
