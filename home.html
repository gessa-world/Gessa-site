<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GESSA – الرئيسية</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/app.css"></head><body>
<main><h1>الرئيسية</h1>
<form class="card" id="pf"><textarea id="pb" rows="3" maxlength="1000" placeholder="بتفكر في إيه؟" required></textarea><button class="btn">نشر</button></form>
<div id="feed"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
GESSA.boot('home',function(c,user){
  var feed=document.getElementById('feed'),h=GESSA.h;
  function load(){
    c.from('posts').select('id,body,created_at,author_id,profiles(username,display_name)').order('created_at',{ascending:false}).limit(50).then(function(r){
      if(r.error)return GESSA.say(r.error.message);
      feed.textContent='';
      if(!r.data.length)feed.append(h('p','muted','مفيش منشورات لسه. كن أول واحد ينشر!'));
      r.data.forEach(function(p){
        var k=h('div','card'),pr=p.profiles||{};
        k.append(h('div','meta',(pr.display_name||pr.username||'مستخدم')+' • '+new Date(p.created_at).toLocaleString('ar-EG')),h('div',null,p.body));
        if(p.author_id===user.id){var x=h('button','link','حذف');x.onclick=function(){c.from('posts').delete().eq('id',p.id).then(load)};k.append(x)}
        feed.append(k);
      });
    });
  }
  document.getElementById('pf').onsubmit=function(e){
    e.preventDefault();var b=document.getElementById('pb');
    c.from('posts').insert({author_id:user.id,body:b.value.trim()}).then(function(r){if(r.error)return GESSA.say(r.error.message);b.value='';load()});
  };
  load();
});
</script></body></html>
